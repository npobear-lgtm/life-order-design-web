# Creates a paid service and persistent disk; review Render's current price before applying.
services:
  - type: web
    name: life-order-design-web
    runtime: python
    region: singapore
    plan: starter
    numInstances: 1
    buildCommand: python --version
    startCommand: python server.py
    healthCheckPath: /api/public
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_DIR
        value: /var/data/life-order
      - key: ADMIN_PASSWORD
        sync: false
      - key: ORGANIZER
        value: 中華欣智社區智能常照關懷協會、安頤創新整合顧問股份有限公司
      - key: PRIVACY_EMAIL
        value: orderdesigner2026@gmail.com
      - key: DATA_RETENTION
        value: 自所報名課程梯次最後一日結束後起算一年；期限屆滿後刪除或去識別化
    disk:
      name: life-order-data
      mountPath: /var/data
      sizeGB: 1
