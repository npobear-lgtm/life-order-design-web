name: Registration integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: life_order_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_order_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - name: SQLite integrity and migration safety
        run: python -m unittest discover -s tests -v
      - name: PostgreSQL and production WSGI
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only-password@127.0.0.1:5432/life_order_test
          TEST_GUNICORN: "1"
          TEST_PRODUCTION: "1"
        run: python -m unittest discover -s tests -v
      - run: node --check public/app.js
      - run: node --check public/admin.js
