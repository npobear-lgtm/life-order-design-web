<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>課務管理｜生活秩序設計</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body><header><a class="brand" href="/">◒ 生活秩序設計</a><a href="/">返回報名頁 ↗</a></header><main class="admin-main"><h1>課務管理</h1><form id="login" class="panel admin-login"><h2>管理員登入</h2><label>管理密碼<input type="password" name="password" autocomplete="current-password" required></label><button class="button">登入後台</button><p class="muted">密碼由部署環境 ADMIN_PASSWORD 設定，至少12字元。</p></form><p id="admin-message" role="status"></p><div id="dashboard" hidden><div class="toolbar"><span id="count" class="badge"></span><a class="outline" href="/api/admin/export">匯出全部 CSV（含個資及授權紀錄）</a><button id="logout" class="outline">登出</button></div><section class="panel"><h2>報名與個資告知設定</h2><p>內容應由主辦單位確認。請先填妥告知資料，再勾選開放報名。變更不會覆蓋既有簽署紀錄。</p><form id="settings"><div class="form-grid"><label>主辦單位全名<input name="organizer" maxlength="500" required></label><label>個資權利聯絡信箱<input name="contact" type="email" maxlength="500" required></label></div><label>資料及肖像授權保存期限（須明確）<input name="retention" maxlength="500" required placeholder="例如：至2028年12月31日，屆期刪除或去識別化"></label><label class="check"><input type="checkbox" name="open">開放報名</label><button class="button">儲存設定</button></form></section><section class="panel"><h2>報名名單</h2><div class="toolbar"><input id="search" type="search" placeholder="搜尋姓名、Email、電話、LINE ID、編號" aria-label="搜尋報名"><select id="filter-course" aria-label="篩選課程"><option value="">全部梯次</option></select><select id="filter-portrait" aria-label="篩選肖像授權"><option value="">全部肖像選項</option><option value="agree">同意授權</option><option value="decline">不同意授權・請避拍</option></select></div><p class="muted">CSV 含個人資料，請限制存取並依保存期限刪除；篩選僅影響畫面，匯出包含全部名單。</p><div class="table-wrap"><table><thead><tr><th>編號／時間</th><th>課程梯次</th><th>學員</th><th>聯絡方式</th><th>LINE ID</th><th>肖像授權</th><th>報名狀態</th><th>簽署紀錄</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>目前沒有符合條件的報名。</p></section></div></main></body></html>
